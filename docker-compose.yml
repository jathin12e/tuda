# Production: two containers behind the server's existing nginx-proxy.
# See DEPLOY.md.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tuda-backend:latest
    container_name: tuda-backend
    restart: unless-stopped
    environment:
      PORT: "4000"
      CORS_ORIGIN: https://tuda.intelithon.in
      VIRTUAL_HOST: tuda-api.intelithon.in
      VIRTUAL_PORT: "4000"
      LETSENCRYPT_HOST: tuda-api.intelithon.in
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - proxy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: https://tuda-api.intelithon.in/api
    image: tuda-frontend:latest
    container_name: tuda-frontend
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: tuda.intelithon.in
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: tuda.intelithon.in
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - proxy
    depends_on:
      - backend

networks:
  proxy:
    external: true
